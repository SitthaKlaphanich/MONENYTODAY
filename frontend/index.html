<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
    <h1>สมัครสมาชิก</h1>
    <form >
        <div>
            <input required type="text" name="first-name" id="first-name-input" placeholder="ชื่อ นามสกุล">
        </div>
        <div>
            <input required type="text" name="email" id="email-input" placeholder="อีเมล">
        </div>
        <div>
            <input required type="password" name="password" id="password-input" placeholder="รหัสผ่าน">
        </div>
        <div>
            <input required type="password" name="repeat-password" id="repeat-password-input" placeholder="ยืนยันรหัสผ่าน">
        </div>
        <button type="submit">สมัครสมาชิก</button>
    </form>
    <p>สมัครสมาชิกแล้วลงชื่อเข้าใช้งาน <a href="login.html">คลิกที่นี่</a></p>
    </div>
</body>
</html>
