<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="js/validation.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <h1>เข้าสู่ระบบ</h1>
        <p id="error-message"></p>
        <form id="form">
            <div>
                <input required type="text" name="email" id="email-input" placeholder="อีเมล">
            </div>
            <div>
                <input required type="password" name="password" id="password-input" placeholder="รหัสผ่าน">
            </div>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <p>ยังไม่มีบัญชีใช่หรือไม่? <a href="index.html">สมัครสมาชิกที่นี่</a></p>
    </div>
</body>
</html>
