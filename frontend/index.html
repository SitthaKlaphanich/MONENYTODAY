<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <div class="wrapper"></div>
    <h1>Sign up</h1>
    <form >
        <div>
            <input required type="text" name="first-name" id="first-name-input" placeholder="First Name">
        </div>
        <div>
            <input required type="text" name="email" id="email-input" placeholder="Email">
        </div>
        <div>
            <input required type="password" name="password" id="password-input" placeholder="Password">
        </div>
        <div>
            <input required type="password" name="repeat-password" id="repeat-password-input" placeholder="Repeat Password">
        </div>
        <button type="submit">Sign up</button>
    </form>
</body>
</html>
